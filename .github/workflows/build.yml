name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 16
        uses: actions/setup-java@v4
        with:
          java-version: '16'
          distribution: 'temurin'
      - name: Setup Gradle
        run: gradle init --type java-application || true
      - name: Build with Gradle
        run: gradle build
      - name: Upload Finished Mod
        uses: actions/upload-artifact@v4
        with:
          name: ReallyWorld-Cheat
          path: build/libs/*.jar
          
